<!-- === PARTE 1: CABEÇALHO === -->
<header id="cabecalho-principal">
    <div class="cabecalho-esquerda">
        <!-- Logo -->
        <div class="logo-placeholder" id="logo-site">
            <!-- Ícone provisório de castelo até sua logo entrar -->
            <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M21 9v4h-2V9h-2v4h-2V9h-2v4h-2V9H9v4H7V9H5v4H3V9H1v12h22V9h-2zm-3-4V1h-2v4h-2V3h-2v2h-2V3H8v2H6V3H4v2H2V1H0v6h24V1h-2v4z"/></svg>
        </div>
        <div class="titulo-site">
            <h1 class="fonte-titulo">Mundo dos Sonhos</h1>
            <div class="subtitulo">
                <span class="linha-dourada"></span>
                Seu mundo, suas histórias
                <span class="linha-dourada"></span>
            </div>
        </div>
    </div>
    
    <div class="acoes-topo">
        <button class="btn-acao" id="btn-som">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>

        </button>
        <button class="btn-acao" id="btn-busca">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

        </button>
    </div>
</header>
